<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0a1120">
  <title>우리</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 18% 10%,#174b4c 0,transparent 45%),radial-gradient(ellipse at 82% 78%,#302459 0,transparent 45%),#0a1120;color:#f2f9f7;font-family:"Malgun Gothic","Microsoft JhengHei",system-ui,sans-serif;text-align:center}.panel{width:min(100%,420px);padding:56px 30px;border:1px solid rgba(225,245,240,.2);border-radius:28px;background:rgba(12,21,40,.65);box-shadow:0 28px 70px rgba(0,0,0,.18)}.kicker{font-size:11px;letter-spacing:.2em;color:#a6bfc7;font-weight:700}.mark{font-size:clamp(86px,19vw,130px);letter-spacing:-.1em;line-height:1;margin:30px 0;background:linear-gradient(110deg,#d8ffe8,#a2deda,#d3baff,#ffd0dc);background-size:220%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:glow 12s ease-in-out infinite alternate}.copy{line-height:1.8;color:#c4d2dc;margin:0 0 28px}.cta{display:flex;align-items:center;justify-content:center;width:fit-content;min-width:195px;min-height:50px;margin:0 auto;padding:12px 24px;border-radius:999px;background:#e6f9ef;color:#102725;text-decoration:none;font-weight:800}.cta:focus-visible{outline:3px solid #a6e7e3;outline-offset:4px}@keyframes glow{to{background-position:100%}}@media(prefers-reduced-motion:reduce){.mark{animation:none}}
  </style>
</head>
<body>
  <main class="panel">
    <div class="kicker">A LITTLE SPACE OF OUR OWN</div>
    <h1 class="mark">우리</h1>
    <p class="copy">在這裡，慢慢收藏每個日常。</p>
    <a class="cta" href="https://gooddays.carewear.workers.dev/uri">前往我們的空間</a>
  </main>
</body>
</html>
